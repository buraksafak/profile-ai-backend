# Ubuntu VPS production stack.
# App joins existing edge proxy via external `shared-network`.
# Do not publish host ports and do not use --proxy when global_nginx owns :80.
services:
  db:
    image: postgres:16-alpine
    container_name: profile-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - profile-ai
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: profile-ai-app:prod
    container_name: profile-ai-app
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      TZ: ${TZ:-Europe/Istanbul}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      API_SECRET_KEY: ${API_SECRET_KEY:?API_SECRET_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-buraksafak2109@gmail.com}
      CONTACT_FROM_EMAIL: "${CONTACT_FROM_EMAIL:-Profile AI <beth.t@example.com>}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - profile-ai
      - shared-network
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"

  nginx:
    image: nginx:1.27-alpine
    container_name: profile-ai-nginx
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - profile-ai
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: "0.25"

volumes:
  postgres_data:

networks:
  profile-ai:
    driver: bridge
  shared-network:
    external: true
