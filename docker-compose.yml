# Local development. For Ubuntu VPS use docker-compose.prod.yml.
services:
  db:
    image: postgres:16-alpine
    container_name: profile-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-profile_ai}
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - profile-ai

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-development}
    container_name: profile-ai-app
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      TZ: ${TZ:-Europe/Istanbul}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/profile_ai?schema=public}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      API_SECRET_KEY: ${API_SECRET_KEY:-change-me-to-a-long-random-secret}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-buraksafak2109@gmail.com}
      CONTACT_FROM_EMAIL: "${CONTACT_FROM_EMAIL:-Profile AI <beth.t@example.com>}"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${APP_BIND:-0.0.0.0}:${PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    volumes:
      - ./src:/usr/src/app/src
      - ./prisma:/usr/src/app/prisma
      - ./prompts:/usr/src/app/prompts
      - ./package.json:/usr/src/app/package.json
      - ./tsconfig.json:/usr/src/app/tsconfig.json
      - app_node_modules:/usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - profile-ai

volumes:
  postgres_data:
  app_node_modules:

networks:
  profile-ai:
    driver: bridge
