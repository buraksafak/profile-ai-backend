# Ubuntu host nginx reverse proxy (optional).
# Copy to /etc/nginx/sites-available/profile-ai and enable:
#   sudo cp deploy/nginx.host.conf /etc/nginx/sites-available/profile-ai
#   sudo ln -sf /etc/nginx/sites-available/profile-ai /etc/nginx/sites-enabled/profile-ai
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS with Certbot:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.example.com
#
# Bind the app to localhost first:
#   APP_BIND=127.0.0.1

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 1m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
